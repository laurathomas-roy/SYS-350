hostname: ${hostname}
fqdn: ${hostname}.local

users:
  - default
  - name: ${student_name}
    gecos: "Student User"
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    groups: users, admin
    shell: /bin/bash
    lock_passwd: false
    hashed_passwd: $6$Sta/gASJkiEyYJtp$AmosMRLS2/S6H4lUeDqNoZjRhv8YNd5XJkqn/ZyJAhOkC9O.k.Pd1nonfhqzXaPrNokmo7/lqNJ.nqOd0FZ6S1    
    ssh_authorized_keys:
      - ${ssh_public_key}

ssh_pwauth: true

package_update: true
packages:
