services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myapp
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lamp-network

  web:
    build:
      context: ./php
      dockerfile: Dockerfile
    ports:
      - "8080:80"  # Host port 8080 -> Container port 80
    volumes:
      - ./php/src:/var/www/html  # Mount your PHP code into the container
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: myapp
    networks:
      - lamp-network

volumes:
  db_data:

networks:
  lamp-network:
